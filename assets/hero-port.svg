<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky & Ocean Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1f38"/>
      <stop offset="45%" stop-color="#1B365D"/>
      <stop offset="70%" stop-color="#244573"/>
      <stop offset="100%" stop-color="#142c4c"/>
    </linearGradient>

    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f294a"/>
      <stop offset="40%" stop-color="#0c213d"/>
      <stop offset="100%" stop-color="#071324"/>
    </linearGradient>

    <!-- Mountain Gradient (Sierra Nevada de Santa Marta coastal range) -->
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#213d64" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#152842" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3354"/>
      <stop offset="100%" stop-color="#102035"/>
    </linearGradient>

    <!-- Overlay Tint Gradient -->
    <linearGradient id="overlayNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#122744" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0a1626" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Container Color Accents -->
    <linearGradient id="contOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E87722"/>
      <stop offset="100%" stop-color="#cf6112"/>
    </linearGradient>
    <linearGradient id="contBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A629A"/>
      <stop offset="100%" stop-color="#1B365D"/>
    </linearGradient>
    <linearGradient id="contRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C23B22"/>
      <stop offset="100%" stop-color="#9E2A15"/>
    </linearGradient>
    <linearGradient id="contGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B7A43"/>
      <stop offset="100%" stop-color="#11522C"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="650" fill="url(#skyGrad)"/>

  <!-- Distant Sierra Nevada Peaks -->
  <polygon points="0,480 280,310 520,440 850,260 1180,420 1520,290 1920,460 1920,650 0,650" fill="url(#mountainGrad1)"/>
  <polygon points="0,540 380,390 740,510 1060,370 1420,490 1780,380 1920,490 1920,650 0,650" fill="url(#mountainGrad2)"/>

  <!-- Deep Sea Harbor of Santa Marta -->
  <rect y="600" width="1920" height="480" fill="url(#seaGrad)"/>
  <!-- Sea Reflections -->
  <ellipse cx="600" cy="740" rx="400" ry="15" fill="#245187" opacity="0.25"/>
  <ellipse cx="1400" cy="780" rx="350" ry="12" fill="#E87722" opacity="0.15"/>
  <ellipse cx="900" cy="820" rx="500" ry="10" fill="#2A629A" opacity="0.2"/>

  <!-- Large Container Vessel (Buque Portacontenedores) -->
  <g transform="translate(180, 480)">
    <!-- Hull -->
    <path d="M 0,220 L 70,220 L 760,220 L 840,160 L 680,160 L 60,160 Z" fill="#182333"/>
    <path d="M 60,160 L 680,160 L 710,130 L 70,130 Z" fill="#9E2A15"/>
    <!-- Bulbous Bow & Water Splash -->
    <path d="M 835,165 Q 855,185 820,210" stroke="#4878a8" stroke-width="4" fill="none" opacity="0.5"/>

    <!-- Bridge / Control Tower -->
    <rect x="140" y="30" width="85" height="100" fill="#E1E7EE"/>
    <rect x="150" y="45" width="65" height="15" fill="#1B365D"/>
    <rect x="150" y="70" width="65" height="15" fill="#1B365D"/>
    <!-- Radar & Antennas -->
    <line x1="182" y1="30" x2="182" y2="5" stroke="#E1E7EE" stroke-width="3"/>
    <line x1="170" y1="12" x2="195" y2="12" stroke="#E1E7EE" stroke-width="2"/>
    <circle cx="182" cy="5" r="4" fill="#E87722"/>

    <!-- Stacked Containers on Deck -->
    <!-- Bay 1 -->
    <rect x="250" y="100" width="85" height="30" fill="url(#contOrange)"/>
    <rect x="250" y="70" width="85" height="28" fill="url(#contBlue)"/>
    <rect x="250" y="40" width="85" height="28" fill="url(#contGreen)"/>

    <!-- Bay 2 -->
    <rect x="340" y="100" width="85" height="30" fill="url(#contRed)"/>
    <rect x="340" y="70" width="85" height="28" fill="url(#contOrange)"/>
    <rect x="340" y="40" width="85" height="28" fill="url(#contBlue)"/>
    <rect x="340" y="10" width="85" height="28" fill="url(#contGreen)"/>

    <!-- Bay 3 -->
    <rect x="430" y="100" width="85" height="30" fill="url(#contBlue)"/>
    <rect x="430" y="70" width="85" height="28" fill="url(#contGreen)"/>
    <rect x="430" y="40" width="85" height="28" fill="url(#contOrange)"/>

    <!-- Bay 4 -->
    <rect x="520" y="100" width="85" height="30" fill="url(#contGreen)"/>
    <rect x="520" y="70" width="85" height="28" fill="url(#contRed)"/>
    <rect x="520" y="40" width="85" height="28" fill="url(#contBlue)"/>

    <!-- Bay 5 -->
    <rect x="610" y="100" width="75" height="30" fill="url(#contOrange)"/>
    <rect x="610" y="70" width="75" height="28" fill="url(#contGreen)"/>
  </g>

  <!-- Port Pier / Terminal Docks -->
  <polygon points="1050,680 1920,680 1920,1080 950,1080" fill="#141E2B"/>
  <line x1="1050" y1="680" x2="1920" y2="680" stroke="#E87722" stroke-width="4"/>

  <!-- Giant Quay Gantry Crane (Grúa STS - Puerto de Santa Marta) -->
  <g transform="translate(1250, 310)">
    <!-- Base Legs -->
    <polygon points="20,370 45,370 70,160 45,160" fill="#E87722"/>
    <polygon points="220,370 195,370 170,160 195,160" fill="#E87722"/>
    <!-- Cross Bracing -->
    <line x1="45" y1="320" x2="195" y2="210" stroke="#cf6112" stroke-width="6"/>
    <line x1="45" y1="210" x2="195" y2="320" stroke="#cf6112" stroke-width="6"/>
    <line x1="45" y1="265" x2="195" y2="265" stroke="#cf6112" stroke-width="6"/>
    <!-- Machine House -->
    <rect x="40" y="130" width="160" height="35" fill="#1B365D"/>
    <!-- Boom / Cantilever arm over water -->
    <polygon points="-280,120 280,120 260,140 -260,140" fill="#E87722"/>
    <!-- Tension cables -->
    <line x1="120" y1="30" x2="-260" y2="120" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
    <line x1="120" y1="30" x2="260" y2="120" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
    <line x1="120" y1="30" x2="120" y2="130" stroke="#E87722" stroke-width="8"/>
    <!-- Spreader / Trolley hoisting container -->
    <rect x="-140" y="140" width="30" height="15" fill="#244573"/>
    <line x1="-135" y1="155" x2="-135" y2="220" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-115" y1="155" x2="-115" y2="220" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Container in air -->
    <rect x="-155" y="220" width="60" height="24" fill="url(#contOrange)"/>
  </g>

  <!-- Container Stacks on Terminal Yard -->
  <g transform="translate(1550, 620)">
    <!-- Row 1 -->
    <rect x="0" y="80" width="75" height="30" fill="url(#contBlue)"/>
    <rect x="80" y="80" width="75" height="30" fill="url(#contOrange)"/>
    <rect x="160" y="80" width="75" height="30" fill="url(#contGreen)"/>
    <rect x="240" y="80" width="75" height="30" fill="url(#contRed)"/>

    <!-- Row 2 -->
    <rect x="0" y="48" width="75" height="30" fill="url(#contRed)"/>
    <rect x="80" y="48" width="75" height="30" fill="url(#contGreen)"/>
    <rect x="160" y="48" width="75" height="30" fill="url(#contOrange)"/>
    <rect x="240" y="48" width="75" height="30" fill="url(#contBlue)"/>

    <!-- Row 3 -->
    <rect x="80" y="16" width="75" height="30" fill="url(#contBlue)"/>
    <rect x="160" y="16" width="75" height="30" fill="url(#contRed)"/>
  </g>

  <!-- Master Corporate Semi-Transparent Navy Filter Overlay -->
  <rect width="1920" height="1080" fill="url(#overlayNavy)"/>

  <!-- Subtle Port Light Vignette -->
  <circle cx="960" cy="460" r="700" fill="#245187" opacity="0.12"/>
</svg>